# SPDX-License-Identifier: GPL-3.0-or-later
#
# Immutable action pins verified from the official repositories on 2026-08-27:
# - actions/checkout v7.0.1:
#   https://github.com/actions/checkout/releases/tag/v7.0.1
# - actions/upload-artifact v7.0.1:
#   https://github.com/actions/upload-artifact/releases/tag/v7.0.1
# - emsdk 3.1.69 tag commit a36df02dc438e8b02f91122a4c62eeecb6784272:
#   https://github.com/emscripten-core/emsdk/releases/tag/3.1.69
# - ubuntu-24.04 runner inventory reviewed at
#   fe6859a246ddeeb78fc8698ec1ff37b628394fe0, including NDK r29:
#   https://github.com/actions/runner-images/blob/fe6859a246ddeeb78fc8698ec1ff37b628394fe0/images/ubuntu/Ubuntu2404-Readme.md

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_web_player:
        description: Build and package the complete RetroArch Web Player
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STRICT_WARNINGS: -Wall -Wextra -Wpedantic -Werror
  EMSDK_REVISION: a36df02dc438e8b02f91122a4c62eeecb6784272
  EMSDK_VERSION: 3.1.69

jobs:
  host-tests:
    name: Strict host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Reject original game data and validate web sources
        run: python3 tools/check_web_sources.py .

      - name: Build and run all host tests with warnings as errors
        run: make test HOST_CC=gcc WARNINGS="$STRICT_WARNINGS"

  native-retroarch-smoke:
    name: Real RetroArch native smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the Ubuntu RetroArch frontend and headless video tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends retroarch xvfb xauth imagemagick

      - name: Build fixture and core, then execute real RetroArch
        run: |
          make -j2 build/tests/test_libretro HOST_CC=gcc WARNINGS="$STRICT_WARNINGS"
          ./build/tests/test_libretro
          make -j2 platform=linux_x86_64 WARNINGS="$STRICT_WARNINGS"
          scripts/test-native-retroarch.sh \
            --content build/tests/RESOURCE.MAP \
            --chapter fishing1 \
            --expected-resources 5 \
            --output build/native-retroarch-ci

  linux-core:
    name: Linux x86_64 core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build shared core
        run: make -j2 platform=linux_x86_64 WARNINGS="$STRICT_WARNINGS"

      - name: Check ELF dynamic exports
        run: >-
          python3 tools/check_core_exports.py
          --format elf
          --tool nm
          build/linux_x86_64/johnny_castaway_libretro.so

      - name: Upload Linux core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-linux-x86_64
          path: |
            build/linux_x86_64/johnny_castaway_libretro.so
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  linux-x86-core:
    name: Linux x86 core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install i386 multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-multilib

      - name: Build and verify i386 shared core
        run: |
          make -j2 platform=linux_x86 WARNINGS="$STRICT_WARNINGS"
          readelf -h build/linux_x86/johnny_castaway_libretro.so | \
            grep -E 'Machine:.*Intel 80386$'
          python3 tools/check_core_exports.py \
            --format elf --tool nm \
            build/linux_x86/johnny_castaway_libretro.so

      - name: Upload Linux x86 core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-linux-x86
          path: |
            build/linux_x86/johnny_castaway_libretro.so
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  windows-core:
    name: Windows x64 core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install MinGW x64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build DLL
        run: make -j2 platform=mingw_x86_64 WARNINGS="$STRICT_WARNINGS"

      - name: Check PE export directory
        run: >-
          python3 tools/check_core_exports.py
          --format pe
          --tool x86_64-w64-mingw32-objdump
          build/mingw_x86_64/johnny_castaway_libretro.dll

      - name: Upload Windows core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-windows-x64
          path: |
            build/mingw_x86_64/johnny_castaway_libretro.dll
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  android-cores:
    name: Android arm64, armv7, x86_64, and x86 cores
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Report runner-provided pinned Android NDK
        run: |
          test -x "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - name: Build all four supported Android ABIs
        run: |
          for platform in android_arm64 android_armv7 android_x86_64 android_x86; do
            make -j2 platform="$platform" \
              ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
              WARNINGS="$STRICT_WARNINGS"
          done

      - name: Check Android ELF machines and libretro exports
        run: |
          while IFS=: read -r machine core; do
            readelf -h "$core" | grep -E "Machine:.*${machine}$"
            python3 tools/check_core_exports.py \
              --format elf --tool nm "$core"
          done <<'EOF'
          AArch64:build/android_arm64/johnny_castaway_libretro.so
          ARM:build/android_armv7/johnny_castaway_libretro.so
          Advanced Micro Devices X86-64:build/android_x86_64/johnny_castaway_libretro.so
          Intel 80386:build/android_x86/johnny_castaway_libretro.so
          EOF

      - name: Upload Android cores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-android-all-abis
          path: |
            build/android_arm64/johnny_castaway_libretro.so
            build/android_armv7/johnny_castaway_libretro.so
            build/android_x86_64/johnny_castaway_libretro.so
            build/android_x86/johnny_castaway_libretro.so
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  portable-cross-cores:
    name: Linux ARM and Windows x86 cross-cores
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install distribution cross-toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            gcc-mingw-w64-i686-posix binutils-mingw-w64-i686

      - name: Build Linux ARM and Windows x86 cores
        run: |
          make -j2 platform=linux_aarch64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=linux_armv7 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=linux_armv7_neon WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=mingw_x86 \
            CC=i686-w64-mingw32-gcc-posix WARNINGS="$STRICT_WARNINGS"

      - name: Check machines and exact libretro exports
        run: |
          aarch64-linux-gnu-readelf -h \
            build/linux_aarch64/johnny_castaway_libretro.so | grep -F 'Machine:                           AArch64'
          arm-linux-gnueabihf-readelf -h \
            build/linux_armv7/johnny_castaway_libretro.so | grep -F 'Machine:                           ARM'
          arm-linux-gnueabihf-readelf -A \
            build/linux_armv7/johnny_castaway_libretro.so | grep -F 'Tag_ABI_VFP_args: VFP registers'
          arm-linux-gnueabihf-readelf -A \
            build/linux_armv7_neon/johnny_castaway_libretro.so | grep -F 'Tag_Advanced_SIMD_arch: NEONv1'
          arm-linux-gnueabihf-readelf -A \
            build/linux_armv7_neon/johnny_castaway_libretro.so | grep -F 'Tag_ABI_VFP_args: VFP registers'
          i686-w64-mingw32-objdump -f \
            build/mingw_x86/johnny_castaway_libretro.dll | grep -F 'architecture: i386'
          python3 tools/check_core_exports.py \
            --format elf --tool aarch64-linux-gnu-nm \
            build/linux_aarch64/johnny_castaway_libretro.so
          python3 tools/check_core_exports.py \
            --format elf --tool arm-linux-gnueabihf-nm \
            build/linux_armv7/johnny_castaway_libretro.so
          python3 tools/check_core_exports.py \
            --format elf --tool arm-linux-gnueabihf-nm \
            build/linux_armv7_neon/johnny_castaway_libretro.so
          python3 tools/check_core_exports.py \
            --format pe --tool i686-w64-mingw32-objdump \
            build/mingw_x86/johnny_castaway_libretro.dll

      - name: Upload portable cross-cores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-linux-arm-and-windows-x86
          path: |
            build/linux_aarch64/johnny_castaway_libretro.so
            build/linux_armv7/johnny_castaway_libretro.so
            build/linux_armv7_neon/johnny_castaway_libretro.so
            build/mingw_x86/johnny_castaway_libretro.dll
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  apple-cores:
    name: macOS, iOS, and tvOS cores
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Report pinned runner toolchain
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk appletvos --show-sdk-path
          xcrun --sdk appletvsimulator --show-sdk-path

      - name: Build universal macOS and every Apple device/simulator mapping
        run: |
          JOBS=2 ./scripts/build-apple-universal.sh
          make -j2 platform=ios_arm64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=ios_sim_arm64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=ios_sim_x86_64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=tvos_arm64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=tvos_sim_arm64 WARNINGS="$STRICT_WARNINGS"
          make -j2 platform=tvos_sim_x86_64 WARNINGS="$STRICT_WARNINGS"

      - name: Check Mach-O architectures and libretro exports
        shell: bash
        run: |
          xcrun lipo build/osx_universal/johnny_castaway_libretro.dylib -verify_arch x86_64 arm64
          while IFS=: read -r architecture core; do
            xcrun lipo "$core" -verify_arch "$architecture"
            python3 tools/check_core_exports.py --format macho --tool nm "$core"
          done <<'EOF'
          arm64:build/ios_arm64/johnny_castaway_libretro_ios.dylib
          arm64:build/ios_sim_arm64/johnny_castaway_libretro_ios_sim_arm64.dylib
          x86_64:build/ios_sim_x86_64/johnny_castaway_libretro_ios_sim_x86_64.dylib
          arm64:build/tvos_arm64/johnny_castaway_libretro_tvos.dylib
          arm64:build/tvos_sim_arm64/johnny_castaway_libretro_tvos_sim_arm64.dylib
          x86_64:build/tvos_sim_x86_64/johnny_castaway_libretro_tvos_sim_x86_64.dylib
          EOF
          python3 tools/check_core_exports.py \
            --format macho --tool nm \
            build/osx_universal/johnny_castaway_libretro.dylib

      - name: Upload Apple cores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-apple-cores
          path: |
            build/osx_universal/johnny_castaway_libretro.dylib
            build/ios_arm64/*.dylib
            build/ios_sim_arm64/*.dylib
            build/ios_sim_x86_64/*.dylib
            build/tvos_arm64/*.dylib
            build/tvos_sim_arm64/*.dylib
            build/tvos_sim_x86_64/*.dylib
            johnny_castaway_libretro.info
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
          if-no-files-found: error
          retention-days: 14

  emscripten-core:
    name: Emscripten core and web source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned official Emscripten SDK and build core archive
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin "$EMSDK_REVISION"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
          make -j2 platform=emscripten WARNINGS="$STRICT_WARNINGS"
          emar t build/emscripten/johnny_castaway_libretro_emscripten.bc | sort

      - name: Validate browser tooling and local-only source graph
        run: |
          bash -n scripts/build-web-player.sh scripts/serve-web.sh scripts/test-native-retroarch.sh
          node --check web/jc-web-player.js
          python3 tools/check_web_sources.py .
          python3 tools/check_web_dist.py --help >/dev/null
          python3 tools/web_smoke_test.py --help >/dev/null

      - name: Upload Emscripten core and web source kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-emscripten-core
          path: |
            build/emscripten/johnny_castaway_libretro_emscripten.bc
            johnny_castaway_libretro.info
            scripts/build-web-player.sh
            scripts/serve-web.sh
            tools/check_web_dist.py
            tools/serve_web.py
            tools/web_smoke_test.py
            web/
            LICENSE
            CREDITS.md
            docs/PROVENANCE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/licenses/BigSoundBank-0266-CC0.md
            docs/WEB_TESTING.md
          if-no-files-found: error
          retention-days: 14

  full-web-player:
    name: Full RetroArch Web Player (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full_web_player
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source and libretro-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned SDK and build complete Web Player
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin "$EMSDK_REVISION"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          JOBS=2 ./scripts/build-web-player.sh
          python3 tools/check_web_dist.py build/web-player/dist

      - name: Upload complete local Web Player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: johnny-castaway-retroarch-web
          path: build/web-player/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
